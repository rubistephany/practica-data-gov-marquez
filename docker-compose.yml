services:
  postgres:
    image: postgres:16.14
    container_name: marquez-db
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - marquez_pgdata:/var/lib/postgresql/data

  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: marquez-server
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml
    volumes:
      - ./marquez.yml:/opt/marquez/marquez.yml
    depends_on:
      postgres:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: marquez-web
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
      PORT: 3000
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    depends_on:
      marquez:
        condition: service_started

  pipeline:
    build: .
    container_name: pipeline-runner
    depends_on:
      marquez:
        condition: service_started
    volumes:
      - ./:/app

volumes:
  marquez_pgdata: